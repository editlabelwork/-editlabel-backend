version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: editlabel
      POSTGRES_PASSWORD: editlabel123
      POSTGRES_DB: editlabel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  backend:
    build: .
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://editlabel:editlabel123@postgres:5432/editlabel
      JWT_SECRET: your-secret-key-here
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    command: npm start

volumes:
  postgres_data:
